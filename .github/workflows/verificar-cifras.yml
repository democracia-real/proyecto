name: Verificar cifras

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cifras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar registro de cifras
        run: python .github/checks/check_cifras.py --online
